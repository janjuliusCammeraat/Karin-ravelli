<style>

  *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
  body{font-family:var(--body);background:var(--ivory);color:var(--espresso);line-height:1.65;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  a{color:inherit;text-decoration:none;}img{display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
  h1,h2{font-family:var(--display);font-weight:300;line-height:1.08;}
  .eyebrow{font-family:var(--body);text-transform:uppercase;letter-spacing:.32em;font-size:.72rem;color:var(--brass-dark);font-weight:400;}

  .brand{font-family:var(--display);font-size:1.7rem;letter-spacing:.06em;}.brand span{color:var(--brass);}

  nav a{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);transition:color .25s;position:relative;padding-bottom:3px;}
  nav a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--brass);transition:width .3s;}
  nav a:hover{color:var(--espresso);}nav a:hover::after{width:100%;}
  nav a.active{color:var(--espresso);}nav a.active::after{width:100%;}

  /* Paginakop */
  .page-hero{background:var(--sand);padding:56px 0 48px;border-bottom:1px solid var(--line);}
  .breadcrumb{font-size:.78rem;letter-spacing:.1em;color:var(--muted);margin-bottom:18px;}
  .breadcrumb a:hover{color:var(--brass-dark);}
  .breadcrumb span{color:var(--muted);margin:0 8px;}
  .page-hero h1{font-size:clamp(2.4rem,5vw,4rem);}
  .page-hero h1 em{font-style:italic;color:var(--brass);}
  .page-hero p{margin-top:14px;color:var(--muted);font-size:1.05rem;max-width:46ch;}

  /* Galerij */
  .galerij{padding:72px 0 96px;}
  .foto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .foto-tile{
    aspect-ratio:4/3;overflow:hidden;border-radius:4px;
    cursor:pointer;position:relative;
    box-shadow:0 4px 12px -4px rgba(42,36,32,.18);
    transition:box-shadow .3s,transform .3s;
  }
  .foto-tile:hover{box-shadow:0 12px 28px -8px rgba(42,36,32,.32);transform:translateY(-3px);}
  .foto-tile img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1);}
  .foto-tile:hover img{transform:scale(1.06);}
  .foto-tile::after{
    content:"";position:absolute;inset:0;
    background:rgba(42,36,32,0);transition:background .3s;
  }
  .foto-tile:hover::after{background:rgba(42,36,32,.08);}

  /* Navigatie tussen categorieën */
  .cat-nav{display:flex;justify-content:space-between;align-items:center;
    padding-top:56px;border-top:1px solid var(--line);}
  .cat-nav a{
    display:inline-flex;align-items:center;gap:8px;
    font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);transition:color .25s;
  }
  .cat-nav a:hover{color:var(--espresso);}

  /* Lightbox */
  #lightbox{
    position:fixed;inset:0;background:rgba(0,0,0,.93);
    display:none;align-items:center;justify-content:center;
    z-index:200;gap:0;
  }
  #lightbox.open{display:flex;}
  #lb-img{max-width:90vw;max-height:88vh;object-fit:contain;border-radius:2px;}
  .lb-btn{
    position:fixed;top:50%;transform:translateY(-50%);
    background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
    font-size:1.8rem;width:52px;height:52px;border-radius:50%;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .2s;flex-shrink:0;
  }
  .lb-btn:hover{background:rgba(255,255,255,.15);}
  #lb-prev{left:20px;}
  #lb-next{right:20px;}
  #lb-close{
    position:fixed;top:18px;right:20px;
    background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
    font-size:1.4rem;width:44px;height:44px;border-radius:50%;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .2s;
  }
  #lb-close:hover{background:rgba(255,255,255,.15);}
  #lb-counter{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,.55);font-size:.82rem;letter-spacing:.1em;}

  footer{background:var(--espresso);color:#C9BEAF;text-align:center;padding:40px 0;font-size:.82rem;letter-spacing:.04em;}
  footer .brand{font-size:1.4rem;color:var(--ivory);display:inline-block;margin-bottom:8px;}
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1);}
  .reveal.in{opacity:1;transform:none;}

  @media(max-width:900px){
    .wrap{padding:0 22px;}
    .nav{height:auto;flex-direction:column;gap:12px;padding:16px 0;}
    nav ul{justify-content:center;gap:16px;}
    .foto-grid{grid-template-columns:1fr 1fr;gap:10px;}
  }
  @media(max-width:520px){
    .foto-grid{grid-template-columns:1fr;}
    #lb-prev{left:6px;}#lb-next{right:6px;}
  }
</style>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Fotoviewer">
  <button id="lb-close" aria-label="Sluiten">×</button>
  <button id="lb-prev"  class="lb-btn" aria-label="Vorige">‹</button>
  <img id="lb-img" src="" alt="">
  <button id="lb-next"  class="lb-btn" aria-label="Volgende">›</button>
  <div id="lb-counter"></div>
</div>

<script>
  // Lightbox — progressive enhancement (koppelt handlers aan bestaande statische HTML)
  var tiles = Array.from(document.querySelectorAll('.foto-tile'));
  var imgs  = tiles.map(function(t) { return t.querySelector('img'); });
  var lb    = document.getElementById('lightbox');
  var lbImg = document.getElementById('lb-img');
  var lbCnt = document.getElementById('lb-counter');
  var cur   = 0;

  function openLb(i) {
    cur = i;
    lbImg.src = imgs[i].src;
    lbImg.alt = imgs[i].alt;
    lbCnt.textContent = (i + 1) + ' / ' + imgs.length;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('lb-close').focus();
  }
  function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
  function prevImg() { openLb((cur - 1 + imgs.length) % imgs.length); }
  function nextImg() { openLb((cur + 1) % imgs.length); }

  tiles.forEach(function(tile, i) {
    tile.addEventListener('click', function() { openLb(i); });
    tile.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') openLb(i);
    });
  });
  document.getElementById('lb-close').addEventListener('click', closeLb);
  document.getElementById('lb-prev').addEventListener('click', prevImg);
  document.getElementById('lb-next').addEventListener('click', nextImg);
  lb.addEventListener('click', function(e) { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', function(e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape')     closeLb();
    if (e.key === 'ArrowLeft')  prevImg();
    if (e.key === 'ArrowRight') nextImg();
  });

  var io = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { threshold: .12 });
  document.querySelectorAll('.reveal').forEach(function(el) { io.observe(el); });
</script>
